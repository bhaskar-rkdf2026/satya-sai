<script>
       function DownloadReport(id) {
        $.showprogress('Loading', 'Loading.....', '');
        $.ajax({
              url: '/erp/Home/DownloadReport',
            method: 'post',
            data: { Enrol_No: id },
            success: function (result) {
                if (result === 1) {
                    swalNoti('Dowloading in progress......... Please wait........', 'success');
                    window.location = 'Download.html';
                }
                else {
                    swalNoti("Record not found", 'error');
                }
                $.hideprogress();
            },
            error: function (ex) {
                $.hideprogress();
            }
        });
    }
</script>
