---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /usr/bin/git lfs pull 2>/dev/null || git lfs pull 2>/dev/null || true
    - /bin/rsync -av --delete --exclude '.git*' --exclude '.cpanel.yml' --exclude '.agents' --exclude '.gemini' --exclude 'scratch' ./ $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH/assets/ 2>/dev/null || true
    - /bin/chmod -R 755 $DEPLOYPATH/data/ 2>/dev/null || true

